# Window rules — mobile adaptations
# Large minimum sizes for touch targets
windowrule = minsize 320 240, class:.*

# Fullscreen apps on mobile (terminal, browser)
windowrule = fullscreen, class:^(kitty|firefox|chromium)$

# Floating dialogs
windowrule = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = center, class:^(pavucontrol|nm-connection-editor|blueman-manager)$

# Opacity for mobile readability
windowrule = opacity 0.95, class:.*