# FireDragon: asusd owns EPP, platform profile and the 80% charge cap.
# Empty values deliberately suppress TLP defaults, including power-saver mode.
CPU_ENERGY_PERF_POLICY_ON_AC=""
CPU_ENERGY_PERF_POLICY_ON_BAT=""
CPU_ENERGY_PERF_POLICY_ON_SAV=""
PLATFORM_PROFILE_ON_AC=""
PLATFORM_PROFILE_ON_BAT=""
PLATFORM_PROFILE_ON_SAV=""
START_CHARGE_THRESH_BAT0=""
STOP_CHARGE_THRESH_BAT0=""

# Allow short interactive bursts; no ineffective Intel percent limits on AMD.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=1
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=auto
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
# AX210 8087:0032 HCI reset / BlueZ NotReady compatibility exception.
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
DISK_DEVICES="nvme0n1"
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
SATA_LINKPWR_ON_AC="med_power_with_dipm max_performance"
SATA_LINKPWR_ON_BAT="min_power"
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
RESTORE_DEVICE_STATE_ON_STARTUP=1
