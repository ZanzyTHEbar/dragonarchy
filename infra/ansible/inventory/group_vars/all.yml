---
dotfiles_architecture:
  system_owner: ansible
  user_owner: chezmoi
  migration_stage: hot_paths
  no_fallbacks: true

dotfiles_supported_os_families:
  - Archlinux
  - Debian

dotfiles_supported_distribution_families:
  arch:
    - Archlinux
    - CachyOS
  debian:
    - Debian
    - Ubuntu

dotfiles_group_capability_map:
  tlp: tlp
  fingerprint: fingerprint
  netbird: netbird
  fortinet_vpn: fortinet_vpn
  asus: asus
  hibernation: hibernation
  aio-cooler: aio_cooler
  v4l2loopback: v4l2loopback
  power_sleep: power_sleep
  iwd: iwd
  networkmanager: networkmanager
  acpi_wakeup: acpi_wakeup

dotfiles_group_gpu_map:
  amd-gpu: amd_gpu
  intel: intel_gpu
  nvidia: nvidia

platform_release_family: UNKNOWN
platform_release_version: UNKNOWN
platform_architecture: UNKNOWN
platform_kernel_family: UNKNOWN
platform_kernel_version: UNKNOWN
platform_boot_firmware: UNKNOWN
platform_bootloader: UNKNOWN
platform_filesystem: UNKNOWN
platform_encryption: UNKNOWN
platform_secure_boot: UNKNOWN
platform_connection_mode: remote-ssh
target_profile: remote-host
target_connection: ssh
platform_local_connection_policy: forbidden
platform_container_policy: forbidden
platform_container_identity: not-applicable
platform_remote_connection_policy: required
platform_controller_home_policy: forbidden
platform_unsupported_combination_policy: reject
platform_generic_family_fallback: forbidden
platform_decision_state: PENDING
platform_decision_owner: leaf-1.1.2
platform_maintainer_gate: G2_PENDING
platform_evidence: repository-inventory-only
