---
host_timezone: Europe/Lisbon
host_role: desktop
host_platform_family: debian
host_desktop_stack: hyprland
host_gpu_stack: []
host_capabilities: []
platform_matrix_id: ubuntu-mobile-dev
# Private target_home, target_source and managed_users belong in 90-local.yml.
# Each account declares name, home, chezmoi_source, shell: /usr/bin/zsh, groups.
# Optional ansible_host/ansible_user select the private SSH endpoint/account.
# The retained account's supplementary group is sudo.
managed_users: []
base_polkit_admin_identities:
  - unix-group:sudo
host_profile_packages:
  - core_cli
  - dev
  - hyprland_session
legacy_host_directory: hosts/ubuntu-mobile-dev
