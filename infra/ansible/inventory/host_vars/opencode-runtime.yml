---
host_timezone: Europe/Lisbon
host_role: server
host_platform_family: debian
host_desktop_stack: none
host_gpu_stack: []
platform_matrix_id: opencode-runtime
platform_release_family: UNKNOWN
platform_release_version: UNKNOWN
platform_architecture: UNKNOWN
platform_kernel_family: UNKNOWN
platform_kernel_version: UNKNOWN
platform_boot_firmware: UNKNOWN
platform_bootloader: UNKNOWN
platform_filesystem: UNKNOWN
platform_encryption: UNKNOWN
platform_secure_boot: UNKNOWN
platform_connection_mode: local
target_profile: container
target_connection: local
target_home: /home/coder
target_source: /home/coder/.local/share/chezmoi
platform_local_connection_policy: required
platform_container_policy: required
platform_container_identity: declared-local-container
platform_remote_connection_policy: forbidden
platform_controller_home_policy: forbidden
platform_unsupported_combination_policy: reject
platform_generic_family_fallback: forbidden
platform_decision_state: PENDING
platform_decision_owner: leaf-1.1.2
platform_maintainer_gate: G2_PENDING
platform_evidence: repository-inventory-only
host_capabilities: []
base_manage_time: false

ansible_connection: local
ansible_become: true
ansible_become_method: sudo

managed_users:
  - name: coder
    home: /home/coder
    chezmoi_source: /home/coder/.local/share/chezmoi
    groups:
      - sudo

legacy_host_directory: hosts/opencode-runtime
