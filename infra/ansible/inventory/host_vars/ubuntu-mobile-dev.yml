---
host_timezone: Europe/Lisbon
host_role: desktop
host_platform_family: debian
host_desktop_stack: hyprland
host_gpu_stack: []
host_capabilities: []
platform_matrix_id: ubuntu-mobile-dev
target_home: /home/ubuntu
target_source: /home/ubuntu/.local/share/chezmoi
base_polkit_admin_identities:
  - unix-group:sudo

host_profile_packages:
  - core_cli
  - dev
  - hyprland_session

managed_users:
  - name: ubuntu
    home: /home/ubuntu
    chezmoi_source: /home/ubuntu/.local/share/chezmoi
    groups:
      - sudo

legacy_host_directory: hosts/ubuntu-mobile-dev
