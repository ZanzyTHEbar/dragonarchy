---
- name: Require one explicitly selected managed user
  ansible.builtin.assert:
    that:
      - dotfiles_target_user is defined
      - dotfiles_target_user | length > 0
      - selected_managed_users | length == 1
    fail_msg: >-
      Exactly one managed user must match dotfiles_target_user on host
      '{{ inventory_hostname }}'.
  vars:
    selected_managed_users: >-
      {{ managed_users | selectattr('name', 'equalto', dotfiles_target_user | default('')) | list }}

- name: Require the selected account's declared supported login shell
  ansible.builtin.assert:
    that:
      - selected_managed_users[0].shell is defined
      - selected_managed_users[0].shell == '/usr/bin/zsh'
    fail_msg: >-
      The selected managed user must declare shell: /usr/bin/zsh.
      The packages role must provide Zsh before the users role runs.
  vars:
    selected_managed_users: >-
      {{ managed_users | selectattr('name', 'equalto', dotfiles_target_user | default('')) | list }}

- name: Inspect the declared login shell after package convergence
  ansible.builtin.stat:
    path: "{{ selected_managed_users[0].shell }}"
    follow: true
  register: users_login_shell
  vars:
    selected_managed_users: >-
      {{ managed_users | selectattr('name', 'equalto', dotfiles_target_user | default('')) | list }}

- name: Read the system's registered login shells
  ansible.builtin.slurp:
    src: /etc/shells
  register: users_registered_shells

- name: Require an installed executable and registered login shell
  ansible.builtin.assert:
    that:
      - users_login_shell.stat.exists
      - users_login_shell.stat.isreg | default(false)
      - users_login_shell.stat.executable | default(false)
      - selected_managed_users[0].shell in (users_registered_shells.content | b64decode).splitlines()
    fail_msg: >-
      Declared login shell /usr/bin/zsh must be installed, executable and
      registered in /etc/shells; refusing to change the selected account.
  vars:
    selected_managed_users: >-
      {{ managed_users | selectattr('name', 'equalto', dotfiles_target_user | default('')) | list }}

- name: Ensure the selected managed user exists with declared supplementary groups
  ansible.builtin.user:
    name: "{{ selected_managed_users[0].name }}"
    shell: "{{ selected_managed_users[0].shell }}"
    groups: "{{ selected_managed_users[0].groups | join(',') }}"
    append: true
    state: present
  vars:
    selected_managed_users: >-
      {{ managed_users | selectattr('name', 'equalto', dotfiles_target_user | default('')) | list }}
