---
- name: Refuse incomplete required AUR / paru tier before any package action
  ansible.builtin.fail:
    msg: >-
      Host '{{ inventory_hostname }}', groups={{ packages_manifest_resolved_groups }}: required paru/AUR tier
      has no managed provider; packages={{ packages_pending_paru | join(', ') }}. Provisioning is incomplete.
  when: packages_pending_paru | length > 0

- name: Refuse incomplete required script tier before any package action
  ansible.builtin.fail:
    msg: >-
      Host '{{ inventory_hostname }}', groups={{ packages_manifest_resolved_groups }}: required script/vendor tier
      has no managed provider; packages={{ packages_pending_script | join(', ') }}. Provisioning is incomplete.
  when: packages_pending_script | length > 0

- name: Install resolved pacman plan (repo-native)
  ansible.builtin.package:
    name: "{{ resolved_package_list_pacman }}"
    state: present
  when:
    - host_platform_family == 'arch'
    - resolved_package_list_pacman | length > 0

- name: Install resolved apt plan (repo-native)
  ansible.builtin.apt:
    name: "{{ resolved_package_list_apt }}"
    state: present
    update_cache: true
  when:
    - host_platform_family == 'debian'
    - resolved_package_list_apt | length > 0
