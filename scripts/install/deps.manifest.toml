[platforms.debian.apt.hyprland_session]
requires_features = ["hyprland"]
packages = [
    "docker.io",
    "docker-buildx",
    # Debian 13 Compose v2; Ubuntu 26.04 virtual name provided by docker-compose-v2.
    "docker-compose",
    "cups",
    "cups-daemon", # Explicit native systemd unit provider, not a recommends assumption.
    "cups-filters",
    "printer-driver-cups-pdf",
    "fastfetch", # Debian 13 / Ubuntu 26.04; About uses an explicit local-only config.
    "hyprland",
    "hypridle",
    "hyprlock",
    "hyprpicker",
    "mate-polkit",
    "uwsm",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-hyprland",
    # Existing hyprland_base mappings, preserving the shipped fcitx5 family/profile.
    "fcitx5",
    "fcitx5-config-qt",
    "fcitx5-frontend-gtk2",
    "fcitx5-frontend-gtk3",
    "fcitx5-frontend-gtk4",
    "fcitx5-frontend-qt5",
    "fcitx5-frontend-qt6",
    "waybar",
    "wl-clipboard",
    # Existing hyprland_aur apt mapping (not an AUR provider on Debian).
    "gnome-keyring",
    # Native providers: see infra/ansible/roles/packages/README.md for provenance.
    "swappy",
    "xdg-user-dirs",
    # Satty and wl-screenrec native source build inputs, not GUI activation.
    "pkg-config",
    "libgtk-4-dev",
    "libadwaita-1-dev",
    "libfontconfig1-dev",
    "libclang-dev",
    "clang",
    "libavutil-dev",
    "libavformat-dev",
    "libavfilter-dev",
    "libavdevice-dev",
    "libdrm-dev",
    "libva-dev",
    # Hyprshot 1.3.0 runtime dependencies (hyprctl comes with hyprland above).
    "grim",
    "slurp",
    "jq",
    "libnotify-bin",
    "procps",
    "util-linux",
    "network-manager-applet", # /usr/bin/nm-applet (not the transitional -gnome package)
    "sway-notification-center", # /usr/bin/swaync and swaync-client
    "swayosd", # /usr/bin/swayosd-server and swayosd-client
    # Retained session-core launchers and Liberation Sans/Serif families.
    "imv",
    "mpv",
    "evince", # org.gnome.Evince.desktop, verified Ubuntu 26.04 file list.
    "fontconfig",
    "fonts-liberation",
    "gtk-update-icon-cache",
    # Official CaskaydiaMono font archive extraction.
    "xz-utils",
    # wl-clip-persist 0.5.0 is source-only upstream; native Rust >=1.85 is
    # release-gated before mutation by the managed packages role.
    "cargo",
    "rustc",
    "gcc",
    "libc6-dev",
    "libgcc-s1",
    "ca-certificates",
    # Walker 2.17.2 shared objects; Elephant provider external commands.
    "libgtk-4-1",
    "libgtk4-layer-shell0",
    "libpoppler-glib8t64",
    "libgdk-pixbuf-2.0-0",
    "libglib2.0-0t64",
    "libcairo2",
    "libgraphene-1.0-0",
    "imagemagick",
    "qalc",
    "bluez",
    "python3",
    "swaybg",
    # Bluetooth SPA is a separate Debian package; do not rely on recommends.
    "pipewire",
    "pipewire-bin",
    "pipewire-alsa",
    "pipewire-pulse",
    "wireplumber",
    "libspa-0.2-bluetooth",
    "alsa-utils",
    "pulseaudio-utils", # pactl client only
    "pamixer",
    "playerctl",
    "rtkit",
    "wob",
    "wlogout",
]

