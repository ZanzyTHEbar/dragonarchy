# Display/session package groups owned by Ansible roles but installed through
# the manifest-backed packages role.
[platforms.arch.pacman.hyprland_session]
requires_features = ["hyprland"]
packages = [
    # Retained desktop development engine; native defaults, desktop_services owner.
    "docker",
    "docker-buildx",
    "docker-compose",
    # Retained local printing; canonical desktop_services owns activation.
    "cups",
    "cups-filters",
    "cups-pdf",
    "hyprland",
    "hypridle",
    "hyprlock",
    "hyprpicker",
    "hyprshot",
    "swappy",
    "satty",
    "grim",
    "slurp",
    "xdg-user-dirs",
    # Pinned wl-screenrec source build; VAAPI capability is runtime-qualified.
    "cargo",
    "rust",
    "clang",
    "ffmpeg",
    "libdrm",
    "libva",
    "polkit",
    "uwsm",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-hyprland",
    "polkit-gnome",
    # Direct retained session runtimes; mappings already declared in hyprland_base.
    "fcitx5",
    "fcitx5-configtool",
    "fcitx5-gtk",
    "fcitx5-qt",
    "waybar",
    "swaync",
    "swayosd",
    "wl-clip-persist",
    # Official Arch extra mappings verified 2026-10-27 (not target qualification).
    "gnome-keyring",
    "wl-clipboard",
    "network-manager-applet",
    # Retained session-core launchers and explicit fontconfig families.
    "imv",
    "mpv",
    "evince", # org.gnome.Evince.desktop, verified official Arch file list.
    "vivaldi", # Official extra; vivaldi-stable.desktop. Owner-selected clean browser.
    "fontconfig",
    "ttf-liberation",
    "gtk-update-icon-cache", # Changed-only managed user Dragon icon refresh.
    "ttf-cascadia-mono-nerd",
    "procps-ng", # pgrep used by the retained Clipse wrapper
    # Pinned Walker/Elephant bundle shared libraries and required provider commands.
    "gtk4",
    "gtk4-layer-shell",
    "poppler-glib",
    "imagemagick",
    "libqalculate",
    "bluez",
    "python",
    "swaybg", # Required owned wallpaper backend; existing swww remains optional.
    # Retained desktop audio: ALSA routing, Bluetooth SPA, Pulse compatibility.
    "pipewire",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-pulse",
    "wireplumber",
    "alsa-utils",
    "libpulse", # pactl, not the old pulseaudio daemon
    "pamixer",
    "playerctl",
    "rtkit",
    "libnotify",
    "wob",
    # Wlogout has no Arch repo package: build pinned upstream with native tools.
    "gtk3",
    "gtk-layer-shell",
    "meson",
    "ninja",
    "gcc",
    "pkgconf",
]

# No AUR build is required for the selected official launcher release bundle.
[platforms.arch.paru.hyprland_session]
requires_features = ["hyprland"]
packages = []

# Official pinned Clipse and coherent Walker/Elephant providers on both families.
[platforms.arch.script.hyprland_session]
