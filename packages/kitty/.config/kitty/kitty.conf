include themes/OneDark.conf
include colors.conf
include font.conf
include mappings.conf

# Base Kitty config (theme is included via colors.conf symlink managed by theme-set)
# Example base settings (adjust to taste)
font_family CaskaydiaMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0
copy_on_select yes
mouse_hide_wait 3.0
shell_integration enable
paste_actions quote-urls-at-prompt,confirm,confirm-if-large
tab_bar_edge top
tab_bar_style powerline
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
confirm_os_window_close 0
