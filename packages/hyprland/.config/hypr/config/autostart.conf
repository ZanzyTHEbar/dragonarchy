# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

# Import this session's environment, then ask the single launcher service owners.
exec-once = ~/.local/bin/dragon-launcher-session

# Core Components
exec-once = uwsm app -- ~/.local/bin/theme-bg-apply &
exec-once = bash -lc 'command -v systemctl >/dev/null 2>&1 && systemctl --user restart dynamic-monitors.service >/dev/null 2>&1 || "$HOME/dotfiles/scripts/theme-manager/dynamic-monitors" --apply >/dev/null 2>&1' &
exec-once = ~/.local/bin/thermal-profile-init &
exec-once = bash -lc 'command -v systemctl >/dev/null 2>&1 && systemctl --user start waybar-hoverd.service' &
exec-once = uwsm app -- fcitx5 &
exec-once = uwsm app -- swaync &
# hypridle.service is requested by the session entry after environment import.
exec-once = uwsm app -- swayosd-server &
exec-once = bash -lc 'command -v systemctl >/dev/null 2>&1 && systemctl --user start polkit-agent.service >/dev/null 2>&1 || "$HOME/.local/bin/start-polkit-agent"' &
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh &

# System Tray
exec-once = nm-applet --indicator &

# Volume/Brightness OSD (WOB)
# IMPORTANT: keybinds write to /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob.
# - Ensure we create a FIFO (not a regular file)
# - Avoid failing if wob isn't installed yet
exec-once = bash -lc 'if command -v wob >/dev/null 2>&1; then rm -f "/tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob"; mkfifo -m 600 "/tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob"; tail -f "/tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob" | wob & disown; fi'

# Walker is started by dragon-launcher-session, ordered after elephant.service.

# Clipboard watchers/persistence are requested by dragon-launcher-session
# after importing the graphical environment; no independent detached listeners.

# Automount USB

exec-once = sh -c 'command -v udiskie >/dev/null 2>&1 && udiskie --tray --notify --automount' 
