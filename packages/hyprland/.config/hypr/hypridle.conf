# Hypridle Configuration
# This file defines idle timeouts and actions for Hyprland

general {
    # Ensure the session locks before sleeping and display power restores on wake
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
    lock_cmd = ~/.local/bin/power-menu --action lock
}

# Turn the display off after 5 minutes (not brightness dimming).
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspend after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
